name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: |
          NAME=$(sed -n 's:.*<string name="app_name">\(.*\)</string>.*:\1:p' app/src/main/res/values/strings.xml | tr -cs 'A-Za-z0-9' '-' | sed 's/-$//')
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME-build${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: '*.apk' }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Debug-signed APK for sideloading. Download the .apk below on your phone and open it.
          files: '*.apk'
          make_latest: true
