name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build (release-signed if key secrets are set, else debug)
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > release.jks
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk out.apk
            echo "KIND=release" >> $GITHUB_ENV
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk out.apk
            echo "KIND=debug" >> $GITHUB_ENV
          fi
          rm -f release.jks
      - name: Name the APK
        run: |
          NAME=$(sed -n 's:.*<string name="app_name">\(.*\)</string>.*:\1:p' app/src/main/res/values/strings.xml | tr -cs 'A-Za-z0-9' '-' | sed 's/-$//')
          VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          mv out.apk "$NAME-v$VER-$KIND.apk"
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: '*.apk' }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ env.KIND }})
          body: APK for sideloading (${{ env.KIND }}-signed). Download the .apk below on your phone and open it.
          files: '*.apk'
          make_latest: true
